name: Probar y desplegar la API

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dos deploys a la vez se pisarían. El segundo espera al primero.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGEN: devgine/dbz-cromeros-api

jobs:
  probar:
    name: Tests
    runs-on: ubuntu-latest

    # Un MySQL de verdad: la mitad de lo que hay que probar es el SQL.
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: prueba
          MYSQL_DATABASE: dbz_prueba
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pprueba"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DBZ_LOG: silent
          DBZ_MYSQL_URL_TEST: mysql://root:prueba@127.0.0.1:3307/dbz_prueba

  imagen:
    name: Construir y publicar la imagen
    needs: probar          # si los tests fallan, no se publica nada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin esto, la falta de un secret se ve como un error de docker login que no
      # dice qué falta. Mejor decirlo derecho.
      - name: Revisar que estén los secrets
        run: |
          faltan=""
          [ -n "${{ secrets.DOCKERHUB_USUARIO }}" ] || faltan="$faltan DOCKERHUB_USUARIO"
          [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]   || faltan="$faltan DOCKERHUB_TOKEN"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan estos secrets en el repo:$faltan"
            echo "Se cargan en Settings > Secrets and variables > Actions." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # Sin buildx ni caché de capas: el runner ya trae Docker, la imagen es chica y
      # tarda menos de un minuto. buildx sólo agregaba una forma más de fallar.
      - name: Entrar a Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USUARIO }}" --password-stdin

      - name: Construir y publicar
        run: |
          docker build -t "$IMAGEN:${{ github.sha }}" .
          docker push "$IMAGEN:${{ github.sha }}"


  desplegar:
    name: Desplegar en el swarm
    needs: imagen
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Revisar que estén los secrets
        run: |
          faltan=""
          for n in SSH_CLAVE SSH_HOST SSH_PUERTO SSH_USUARIO SSH_HUELLA; do
            eval "v=\$$n"
            [ -n "$v" ] || faltan="$faltan $n"
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan estos secrets en el repo:$faltan"
            exit 1
          fi
        env:
          SSH_CLAVE: ${{ secrets.SSH_CLAVE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PUERTO: ${{ secrets.SSH_PUERTO }}
          SSH_USUARIO: ${{ secrets.SSH_USUARIO }}
          SSH_HUELLA: ${{ secrets.SSH_HUELLA }}

      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_CLAVE }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # La huella se fija a mano: sin esto habría que aceptar cualquier host,
          # y ahí un intermediario se lleva el deploy.
          echo "${{ secrets.SSH_HUELLA }}" > ~/.ssh/known_hosts

      - name: Cambiar la imagen del servicio
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PUERTO: ${{ secrets.SSH_PUERTO }}
          USUARIO: ${{ secrets.SSH_USUARIO }}
        run: |
          # La clave está atada a dbz-deploy.sh en el servidor: esto no abre una shell,
          # sólo le pasa el nombre de la imagen al script, que valida y actualiza.
          ssh -p "$PUERTO" -i ~/.ssh/id_ed25519 "$USUARIO@$HOST" \
            "${{ env.IMAGEN }}:${{ github.sha }}"

      - name: Contarlo
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### Desplegado ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Falló — el swarm vuelve solo a la anterior ❌" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`${{ env.IMAGEN }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
