# La API como un servicio más del swarm, igual que el resto de lo que corre acá.
#
# Primer despliegue (una vez):
#   bash infra/preparar-base.sh        # base, usuario y secret dbz_mysql_url
#   printf '%s' "<secreto>" | docker secret create dbz_secreto_proxy -
#   DBZ_DOMINIO=cartas-api.devgine.com.ar #   DBZ_ORIGENES=https://card-collections-frontend.pages.dev #   DBZ_IMAGEN=dbz-cromeros-api:<commit> #     docker stack deploy -c dbz-api.stack.yml --resolve-image never dbz-api
#
# Después el stack no se vuelve a tocar: dbz-despliegue.sh sólo le cambia la imagen.
# La imagen no está en ningún registry —la construye el servidor—, por eso
# --resolve-image never. Si hay que volver a correr el stack deploy, pasarle la que
# está corriendo:
#   DBZ_IMAGEN=$(docker service inspect dbz-api_api --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
version: "3.8"

services:
  api:
    image: ${DBZ_IMAGEN}
    networks: [proxy]

    # Sin ports: no hay ningún puerto publicado. Se entra sólo por Traefik, con el
    # tramo cifrado. Antes estaba el 8081 abierto porque la Function de Pages no tenía
    # forma de llegar de otra manera.

    environment:
      # La URL con la contraseña entra por el secret, no por acá.
      DBZ_MYSQL_URL_FILE: /run/secrets/dbz_mysql_url
      # Qué front tiene permiso de pedirle a esta API. Sin esto el navegador corta.
      DBZ_ORIGENES: ${DBZ_ORIGENES}
      # Quién ve /api/admin/resumen. Separados por coma si alguna vez son varios.
      DBZ_ADMINS: ${DBZ_ADMINS}
      DBZ_VERSION: ${DBZ_IMAGEN}
      PORT: "8787"

    secrets: [dbz_mysql_url]

    # El MySQL no es un servicio del swarm: es un contenedor suelto con el 3306
    # publicado en el host. Desde acá se llega por la gateway de Docker, que es lo
    # que resuelve host-gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      replicas: 1

      # En swarm mode Traefik lee las etiquetas del SERVICIO, no las del contenedor:
      # por eso van acá adentro de deploy y no al nivel de arriba.
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy"
        - "traefik.http.routers.dbz-api.rule=Host(`${DBZ_DOMINIO}`)"
        - "traefik.http.routers.dbz-api.entrypoints=websecure"
        # tls sin resolver: Traefik sirve su certificado autofirmado y Cloudflare, en modo
        # Full, lo acepta. El resolver "le" usa credenciales de la cuenta de Devgine y no
        # puede validar cromeros.com.ar: si quedara puesto, reintentaria contra Let's
        # Encrypt y podria pegarle a los limites del stack edge, que es de los clientes.
        - "traefik.http.routers.dbz-api.tls=true"
        - "traefik.http.services.dbz-api.loadbalancer.server.port=8787"

      update_config:
        # start-first: la nueva levanta y recién cuando está sana entra la anterior a
        # apagarse. Sin esto hay un hueco de unos segundos sin API.
        order: start-first
        failure_action: rollback
        delay: 10s
        monitor: 30s
      rollback_config:
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s

      resources:
        limits:
          # El servidor tiene 2 CPUs y 5.8 GB compartidos con el resto: esto no se
          # puede comer la máquina si algo se descontrola.
          cpus: "0.50"
          memory: 256M

networks:
  proxy:
    external: true

secrets:
  dbz_mysql_url:
    external: true
