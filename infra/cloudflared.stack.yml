# EL TÚNEL A CLOUDFLARE. NO ESTÁ DESPLEGADO, y este archivo no describe lo que hay: es lo
# único que cierra un agujero que sigue abierto. Léase entero antes de correrlo.
#
# LO QUE DECÍA ACÁ HASTA EL 2026-09-27 YA NO ERA CIERTO. Hablaba de reemplazar un camino
# —Pages Function -> nginx :80 -> 127.0.0.1:8081, en HTTP sin cifrar— que se desarmó el
# 2026-09-18, cuando Angel compró cromeros.com.ar. Hoy el navegador le pega DIRECTO a
# https://api.cromeros.com.ar, que entra por Traefik en el 443 y va al servicio por la red
# `proxy`. No hay intermediarios y no hay nada sin cifrar.
#
# QUÉ COMPRARÍA ENTONCES, que es por lo que este archivo no se borró: hoy el origen tiene
# el 443 abierto a internet y pasa la lista blanca de Dattaweb. El freno a la fuerza bruta
# confía en `CF-Connecting-IP`, y eso se sostiene porque Cloudflare rechaza con 403, en el
# borde, cualquier pedido que traiga una cabecera CF-* puesta por el cliente. Pero quien le
# pegue DIRECTO al origen por el 443, salteando Cloudflare, se la inventa y estrena
# contador. Con el túnel no hay puerto que golpear: el contenedor sale hacia afuera y nadie
# entra. La otra forma de cerrarlo es de red —que al origen sólo lleguen los rangos de
# Cloudflare— y esa toca el stack `edge`, que es de los clientes.
#
# Si alguna vez se despliega:
#
#   1. En Cloudflare: Zero Trust > Networks > Tunnels > Create a tunnel > Cloudflared.
#      Copiar el token que da (empieza con eyJ...).
#   2. En el tunnel, agregar un Public Hostname:
#         api.cromeros.com.ar  ->  HTTP  ->  dbz-api_api:8787
#      Ese nombre se resuelve solo porque el túnel está en la red proxy del swarm.
#   3. En el servidor:
#         DBZ_TUNEL_TOKEN='eyJ...' docker stack deploy -c cloudflared.stack.yml dbz-tunel
#
# Y recién DESPUÉS de comprobar que api.cromeros.com.ar sigue contestando por el túnel, se
# saca el router de Traefik del stack de la API. Primero que el camino nuevo ande, después
# apagar el viejo — nunca al revés. Ojo que el `dbz-despliegue.sh` no re-aplica el stack:
# sólo le cambia la imagen al servicio, así que eso va a mano.
version: "3.8"

services:
  tunel:
    image: cloudflare/cloudflared:latest
    # --no-autoupdate: que la versión la cambie un deploy y no el contenedor solo.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${DBZ_TUNEL_TOKEN}
    # Sin ports: el túnel sale hacia afuera, nadie entra. Por eso tampoco le afecta la
    # lista blanca de puertos de Dattaweb.
    networks: [proxy]

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          # El servidor tiene 2 CPUs compartidas con los proyectos de clientes.
          cpus: "0.25"
          memory: 128M

networks:
  proxy:
    external: true
